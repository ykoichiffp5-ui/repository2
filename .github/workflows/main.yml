name: Dashboard

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Linear Data
        run: |
          curl -X POST https://api.linear.app/graphql \
          -H "Authorization: ${{ secrets.LINEAR_API_KEY }}" \
          -H "Content-Type: application/json" \
          -d '{"query":"{ issues(first: 20) { nodes { title state { name } } } }"}' \
          > linear-data.json

          echo "LINEAR_DATA<<EOF" >> $GITHUB_ENV
          cat linear-data.json >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Debug
        run: cat linear-data.json

      - name: Generate HTML
        run: node generate.js

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
