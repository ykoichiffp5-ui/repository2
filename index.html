
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>介護ダッシュボード</title>

  <style>
    body {
      font-family: sans-serif;
      background: #f3f3f3;
      padding: 30px;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 40px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 30px;
      margin-bottom: 25px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .card h2 {
      font-size: 32px;
      margin-bottom: 20px;
    }

    .card p {
      font-size: 24px;
    }
  </style>
</head>

<body>
  <h1>利用者一覧</h1>

  
  <div class="card">
    <h2>合計人数</h2>
    <p>状態: Todo</p>
  </div>

  <div class="card">
    <h2>４階人数</h2>
    <p>状態: Todo</p>
  </div>

  <div class="card">
    <h2>３階人数</h2>
    <p>状態: Todo</p>
  </div>

  <div class="card">
    <h2>2階人数</h2>
    <p>状態: Todo</p>
  </div>


</body>
</html>
