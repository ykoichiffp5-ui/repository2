
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>介護ダッシュボード</title>

<style>
body{
  font-family:sans-serif;
  background:#f3f3f3;
  padding:40px;
}

h1{
  font-size:64px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:30px;
  margin-top:40px;
}

.card{
  background:white;
  border-radius:30px;
  padding:40px;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.label{
  font-size:32px;
  color:#666;
}

.value{
  font-size:96px;
  font-weight:bold;
  margin-top:20px;
}
</style>
</head>

<body>

<h1>📊 介護ダッシュボード</h1>

<div class="grid">

  <div class="card">
    <div class="label">利用者人数</div>
    <div class="value">1人</div>
  </div>

  <div class="card">
    <div class="label">完了件数</div>
    <div class="value">1件</div>
  </div>

</div>

</body>
</html>
