
<!DOCTYPE html>
<html lang="ja">
<head>

  <title>介護ダッシュボード</title>

      background: #f5f5f5;
      padding: 40px;
    }

    h1 {
      margin-bottom: 30px;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <h1>📊 介護ダッシュボード</h1>

  
    <div class="card">
      <h2>利用者A</h2>
      <p>状態: Done</p>
    </div>
  
    <div class="card">
      <h2>合計人数</h2>
      <p>状態: Todo</p>
    </div>
  
    <div class="card">
      <h2>入院者数：０名</h2>
      <p>状態: Todo</p>
    </div>
  
    <div class="card">
      <h2>４階人数：５０名</h2>
      <p>状態: Todo</p>
    </div>
  
    <div class="card">
      <h2>３階人数：５０名</h2>
      <p>状態: Todo</p>
    </div>
  
    <div class="card">
      <h2>2階人数：５０名</h2>
      <p>状態: Todo</p>
    </div>
  

</body>
</html>
